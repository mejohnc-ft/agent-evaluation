  - id: real-leadership-formats
    source: eval run 2026-10-12T17:41:53.051Z (anthropic/claude-haiku-5.5)
    messages:
      - role: user
        content: What formats does your AI leadership training come in, and what do leaders walk away with?
    reply: >-
      Cadre's AI Leadership & Facilitation comes in four formats:


      - 1-Hour Virtual Kickoff

      - Half-Day Executive Session

      - 1-Day Workshop

      - 2-Day Leadership Intensive


      Each session is split 30% teaching, 30% interaction and 40% application. Every example and exercise
      comes from your own operations, and the team identifies 3 to 5 specific problems where AI could have
      impact.


      Leaders leave with:


      - A prioritized shortlist of AI opportunities

      - Clarity on quick wins versus long-term plays

      - A next-step plan


      If you'd like to discuss which format fits your team, I can connect you with an AI Strategist.
