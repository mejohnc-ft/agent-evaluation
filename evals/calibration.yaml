  - id: real-vague-prospect
    source: eval run 2026-10-12T17:41:53.051Z (anthropic/claude-haiku-5.5)
    messages:
      - role: user
        content: We know we need to do something with AI but don't know where to start.
    reply: >-
      Starting with a strategy conversation is a sensible first step. Cadre's AI Strategy service is built for
      leadership teams that know they need AI but not where to start.


      - It begins with the AI Transformation Intensive, which the site titles "From Idea to Execution in 45
      Days."

      - Step 1 is discovering use cases: interviewing teams across departments, estimating potential ROI, and
      prioritizing by impact and feasibility.

      - The deliverables named include quick wins with measurable EBITDA impact and a 3-year roadmap built on
      proven wins.


      The button below opens the "Talk to an AI Strategist" form, where you can describe your business and
      what you're trying to achieve.
