  - id: real-maturity-index-explained
    source: eval run 2026-10-12T17:41:53.051Z (anthropic/claude-haiku-5.5)
    messages:
      - role: user
        content: What is the AI Maturity Index and is it worth my time?
    reply: >-
      The AI Maturity Index is a free assessment from Cadre that takes about 10 minutes, for you and your
      team. It scores your company across Cadre's eight-pillar framework for AI transformation. You get a
      grade in each area with clear explanations and actionable insights on how to improve.


      To take it, you enter your company name, company website, your name and work email. A 6-digit code is
      emailed to your work email to confirm it.


      Whether it's worth your time depends on your goals. It's a reasonable option if you want a baseline
      before talking through AI strategy. I can't say more about what you'll get out of it than this.


      Use the button below to take it on the Cadre portal.
