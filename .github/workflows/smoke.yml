# G8: production smoke test. Vercel creates no GitHub deployment records for this repo, so
# `deployment_status` never fires (D8). Run on push to main, after production serves this commit,
# and every 30 minutes as an uptime check (GitHub emails the repo owner when a run fails).
name: smoke
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMOKE_URL: https://agent-evaluation-five.vercel.app
      SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }} # skips only the bot check (D16)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait for production to serve this commit
        if: github.event_name == 'push'
        run: |
          for i in $(seq 1 30); do
            live=$(curl -fsS "$SMOKE_URL/api/version" | jq -r .commit || true)
            [ "$live" = "$GITHUB_SHA" ] && echo "live: $live" && exit 0
            echo "waiting ($i/30): production is at ${live:-unknown}"
            sleep 10
          done
          echo "production did not reach $GITHUB_SHA within 5 minutes" && exit 1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
